[project]
name = "rtcosmik"
version = "0.1.0"
description = "Real-Time - Constrained and Open Source Multibodied Inverse Kinematics"
readme = "README.md"
authors = [
    { name = "Maxime Sabbah" },
    { name = "Kahina Chalabi" },
    { name = "Mohamed Adjel" },
    { name = "Thomas Bousquet" },
    { name = "Vincent Bonnet" },
]
maintainers = [
    { name = "Guilhem Saurel", email = "guilhem.saurel@laas.fr" }
]
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "tensorflow>=2.11.1",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
