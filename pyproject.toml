[project]
name = "rtcosmik"
version = "0.1.0"
description = "Real-Time - Constrained and Open Source Multibodied Inverse Kinematics"
readme = "README.md"
authors = [
    { name = "Maxime Sabbah" },
    { name = "Kahina Chalabi" },
    { name = "Mohamed Adjel" },
    { name = "Thomas Bousquet" },
    { name = "Vincent Bonnet" },
]
maintainers = [
    { name = "Guilhem Saurel", email = "guilhem.saurel@laas.fr" }
]
requires-python = ">=3.9, <3.12"
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4, <2",
    "pandas>=2.0.3",
    "tensorflow[and-cuda]>=2.11.1, <2.16",
    "optuna>=3.0,<4",
    "optuna-integration>=3.6",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=8.18.1",
]
