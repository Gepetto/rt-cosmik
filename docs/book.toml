[book]
title = "RT-COSMIK"
description = "Real-time, markerless, whole-body biomechanics from ordinary cameras"
authors = ["The RT-COSMIK authors"]
language = "en"
src = "."

[build]
# The API pages are generated by gen_api.py before the book is built: a page
# SUMMARY.md lists but nobody generated should fail the build, not appear empty.
create-missing = false

# $...$ and $$...$$, as GitHub renders them, typeset at build time.
[preprocessor.katex]
after = ["links"]

[output.html]
git-repository-url = "https://github.com/Gepetto/rt-cosmik"
site-url = "/rt-cosmik/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/cosmik.css"]
